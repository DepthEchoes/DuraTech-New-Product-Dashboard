# Nginx 反向代理配置 - DuraTech 需求池看板在线版
# 由 deploy/setup_server.sh 在部署时自动生成到 /etc/nginx/sites-available/duratech
# （下方为参考模板，server_name 与证书路径由脚本注入）
#
# 部署后会:
#   - 80 端口强制 301 跳转到 HTTPS
#   - 443 端口用自签证书提供 HTTPS（浏览器会提示不安全，点继续即可）
#   - 反向代理到本地 waitress (127.0.0.1:58901)
#
# 若后续有域名，可改用 Let's Encrypt:
#   sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name 116.62.43.110;       # 改成你的公网 IP 或域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 116.62.43.110;

    ssl_certificate     /etc/ssl/certs/duratech.crt;
    ssl_certificate_key /etc/ssl/private/duratech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;        # 允许上传较大的卖家精灵 Cookie/JSON
    proxy_read_timeout  120s;        # 需求池全量数据响应较慢
    proxy_send_timeout  120s;

    location / {
        proxy_pass http://127.0.0.1:58901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
