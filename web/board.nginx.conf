# Nginx 反向代理配置示例
# 保存为 /etc/nginx/sites-available/durabay，再 ln -s 到 sites-enabled
# 修改 server_name 为你的域名或服务器公网 IP

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或公网 IP

    client_max_body_size 20m;       # 允许上传较大的卖家精灵 JSON

    location / {
        proxy_pass http://127.0.0.1:58901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# 如需 HTTPS（推荐），用 certbot 申请证书后自动生成 443 配置：
#   sudo certbot --nginx -d your-domain.com
